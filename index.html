<h1>Nara</h1>
<p>A Nara é a assistente pessoal de uma única pessoa, o próprio dono da conta Google que a autorizou. Ela não é oferecida ao público.</p>
<p>Ela organiza tarefas, lembra compromissos da agenda e ajuda a ler e responder e-mails do próprio dono, sempre a pedido dele.</p>
